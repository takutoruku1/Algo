<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>キャラクターを動かす - Phaser Demo</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #1b1b2b;
      color: #eee;
      font-family: sans-serif;
      height: 100%;
    }
    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 16px;
      box-sizing: border-box;
    }
    #game {
      border: 2px solid #444;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .hint {
      font-size: 14px;
      color: #aab;
      text-align: center;
      line-height: 1.6;
    }
    kbd {
      background: #333;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 1px 6px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>キャラクターを動かす 🎮</h1>
    <div id="game"></div>
    <p class="hint">
      <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> または <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> で移動 ／
      <kbd>Space</kbd> でアクション<br />
      ※ <code>assets/character.png</code> を置くと、その画像でキャラが動きます（未配置なら仮スプライトで動作）
    </p>
  </div>

  <!-- Phaser 本体（ブラウザのネット接続が必要） -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

  <!-- ゲーム本体（読み込み順を維持するため type="module" にはしない） -->
  <script src="src/config.js"></script>
  <script src="src/scenes/PlayScene.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
